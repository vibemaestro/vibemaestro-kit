name: test

# Every ready PR runs the PLAN of its change: the suites tests/plan.py picks from tests/suites.map, plus the coverage guard
# (test-plan.sh). A push to main runs no suite: the full suite runs on a schedule, twice a week (test-full.yml). The term scan
# runs on PRs and on push.
# Job `tests` needs no secret and no other repo; job `scan-terms` reads the secret KIT_TERMS (the internal-term list).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

# A new commit on the PR cancels the run of the head it replaces. Every other event (a comment, an edit, a label, a review,
# ready, main, a dispatch) gets a group of its own, so it neither cancels a commit run nor replaces a pending one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}-${{ github.event.action == 'synchronize' && 'commit' || github.run_id }}
  cancel-in-progress: ${{ github.event.action == 'synchronize' }}

jobs:
  tests:
    name: bash tests/run-all.sh   # the check name branch protection may require: kept as it was
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    # Self-hosted runner when the repo variable CI_RUNNER is set. Unset: a private repository fails at once (the expression errors; it never
    # falls back to a paid hosted runner), the public repository uses GitHub-hosted ubuntu-latest. Remove CI_RUNNER before the repository goes public.
    runs-on: ${{ vars.CI_RUNNER || (github.repository_visibility == 'public' && 'ubuntu-latest' || fromJSON('CI_RUNNER is not set in a private repository')) }}
    timeout-minutes: 45   # a plan can be the full suite (a planner change, an unmapped file): 18-30 minutes on the runner
    steps:
      # Full history: the planner diffs from the merge-base, and tests/test-contract.sh compares with origin/main (which a full
      # clone has; a depth-1 fetch on top would make the clone shallow). No credentials kept in the clone the suites read.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # CLI `claude` chỉ cần cho phần test validate / cài từ thư mục / chạy hook từ bản cache; không cần đăng nhập.
      # PLUGIN_REQUIRE_CLAUDE=1: thiếu CLI thì suite ĐỎ thay vì tự bỏ qua.
      - name: Cài CLI claude (không đăng nhập)
        run: npm install -g @anthropic-ai/claude-code@2.1.290

      # The plan of this change: the checkout is GitHub's merge commit of the PR head into the current main, so the plan is the
      # diff from its first parent, what merging changes. Not the event's base.sha: that is the main of the PR's last push, and a
      # diff from it also counts what other PRs merged since. A checkout that is not a two-parent merge whose second parent is the
      # event's head.sha gives the full suite. PR_HEAD is unset before the run: the suites inherit the step's environment, and one
      # of them (test-export-gate.sh) runs a workflow step that reads a PR_HEAD of its own.
      - name: Chạy bộ test (the plan of this change)
        env:
          PLUGIN_REQUIRE_CLAUDE: "1"
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: pr_head=$PR_HEAD; unset PR_HEAD; bash tests/run-all.sh --changed "@merge-parent:$pr_head"

  # The internal-term scan: the owner's term list (repository secret KIT_TERMS) over the tracked tree.
  # Why a secret: the list holds the very names it hunts, so it is never committed.
  # Fail closed: an empty or missing secret, a control miss or a hit outside kb/ is red. kb/ is only counted (owner decision O3, deferred).
  # Forks get no secret, so their run is red too (the repository is private). No term is ever printed: the scanner prints term
  # indexes and counts, the secret is in this one step's environment only, no `set -x`, no job summary, no artifact, no add-mask.
  # Only where the term list lives: a public copy of this file skips the job instead of failing closed on every PR.
  scan-terms:
    name: internal-term scan
    if: github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    # Light gate runner when CI_GATE_RUNNER is set, else CI_RUNNER; the same on every job: a private repository with neither variable fails at once
    # (a self-hosted runner only serves a private repository), the public repository (no runner) uses GitHub-hosted ubuntu-latest
    runs-on: ${{ vars.CI_GATE_RUNNER || vars.CI_RUNNER || (github.repository_visibility == 'public' && 'ubuntu-latest' || fromJSON('CI_RUNNER is not set in a private repository')) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Scan the tracked tree with the term list
        env:
          KIT_TERMS: ${{ secrets.KIT_TERMS }}
        run: |
          set -uo pipefail
          if [ -z "${KIT_TERMS:-}" ] || [ -z "${KIT_TERMS//[[:space:]]/}" ]; then
            echo "::error::The KIT_TERMS secret is empty or missing: the internal-term scan cannot run, and a scan that did not run must not pass."
            exit 1
          fi
          umask 077
          # the scanner's own scratch copy of the parsed terms goes under RUNNER_TEMP too: the runner cleans it, /tmp it does not
          export TMPDIR="${RUNNER_TEMP:?}"
          terms=$(mktemp "$TMPDIR/kit-terms.XXXXXX") || exit 1
          trap 'rm -f "$terms"' EXIT
          chmod 600 "$terms"
          printf '%s\n' "$KIT_TERMS" > "$terms"
          unset KIT_TERMS
          rc=0
          out=$(bash scripts/scan-internal-terms.sh --ci --terms "$terms" --exclude kb/ --tree 2>&1) || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then
            echo "::error::The internal-term scan failed (exit $rc): a hit outside kb/, a control miss or an unusable term list. The log has term indexes only."
            exit 1
          fi
          if [ "${out##*$'\n'}" != "control: found 1/1; hits: 0" ]; then
            echo "::error::The scan did not end with 'control: found 1/1; hits: 0'."
            exit 1
          fi
